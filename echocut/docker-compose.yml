services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: echocut, POSTGRES_USER: echocut, POSTGRES_PASSWORD: echocut }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U echocut"], interval: 5s, timeout: 3s, retries: 15 }
  clickhouse:
    image: clickhouse/clickhouse-server:25.7
    environment: { CLICKHOUSE_DB: echocut, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1 }
    ports: ["8123:8123", "9000:9000"]
    volumes: [clickhouse_data:/var/lib/clickhouse, ./infra/clickhouse:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"], interval: 5s, timeout: 3s, retries: 20 }
  backend:
    build: ./backend
    env_file: .env
    environment: { DATABASE_URL: postgresql+psycopg://echocut:echocut@postgres:5432/echocut, CLICKHOUSE_HOST: clickhouse }
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, clickhouse: { condition: service_healthy } }
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: { postgres_data: {}, clickhouse_data: {} }
